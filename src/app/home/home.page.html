  <!-- Projects Showcase Section -->
  <div class="section-container ion-margin-top ion-padding-bottom">
    <h2 class="section-heading ion-padding-start">Featured Engineering Projects</h2>
    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="12" size-md="6" *ngFor="let project of projects">
          <ion-card class="project-card">
            <img [src]="project.image" class="project-img" alt="Project Cover" />
            <ion-card-header>
              <ion-card-subtitle color="primary">{{ project.subtitle }}</ion-card-subtitle>
              <ion-card-title>{{ project.title }}</ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <p class="project-desc">{{ project.description }}</p>
              <ion-button fill="clear" size="small" class="ion-no-padding ion-margin-top">
                Explore Case Study
                <ion-icon slot="end" name="open-outline"></ion-icon>
              </ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
